# Dependabot — https://docs.github.com/code-security/dependabot
#
# Scope is deliberately narrow: ONLY the github-actions ecosystem. Its single
# job here is to keep the SHA-pinned actions in .github/workflows/*.yml fresh —
# we pin every action to a full commit SHA (supply-chain hardening: a moved tag
# can't silently swap the code that runs in CI / builds our release artifacts),
# and Dependabot is what bumps the SHA + version comment when a new release
# ships. Without it, SHA pins rot silently.
#
# npm is enabled for SECURITY UPDATES ONLY. Feature bumps stay manual on
# purpose — this repo manages runtime deps by hand (bundle-size discipline,
# lazy chunks), and a stream of "bump X 1.2.3 → 1.2.4" PRs is how a queue of
# real security PRs gets skimmed past. `npm audit` reports; this is what
# actually opens the fix.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
    # One grouped PR for all action bumps instead of one PR per action.
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # The whole point of the block: nothing but advisories.
    open-pull-requests-limit: 5
    commit-message:
      prefix: fix
    groups:
      npm-security:
        patterns:
          - "*"
    # Dependabot opens version-update PRs unless told not to; this leaves only
    # the security ones, which it raises regardless of this setting.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
