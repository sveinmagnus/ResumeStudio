name: Secret scan

# Catches a committed key, token or credential before it reaches a public
# repository — where "rotate it" becomes the only remedy, because a public
# commit is scraped within minutes and deleting it does not un-publish it.
#
# Concretely relevant here: this app is BYO-LLM and BYO-translation, so a
# developer testing it locally has real OpenAI / Anthropic / DeepL keys within
# reach of an accidental `git add`. `.env` is gitignored, which is a convention
# rather than a guarantee.

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history: a secret committed months ago and "removed" in a later
          # commit is still in the pack, still public, and still valid.
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
