title: Cartavio Resume Studio
description: Self-hosted multi-language CV manager for consultants. One master resume, targeted PDF, Word and ATS exports for each audience.
url: https://sveinmagnus.github.io
baseurl: /ResumeStudio
lang: en
logo: /assets/logo.png
author: Cartavio
social:
  name: Cartavio
  links:
    - https://cartavio.no
    - https://github.com/sveinmagnus/ResumeStudio

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
theme: jekyll-theme-cayman

# All download/source links in the site read from {{ site.repo_url }}.
repo_url: https://github.com/sveinmagnus/ResumeStudio

# Navigation shown on every page (rendered in the layout's header).
nav:
  - title: Home
    url: /
  - title: Features
    url: /features.html
  - title: Download
    url: /download.html
  - title: How-to
    url: /how-to.html

defaults:
  - scope:
      path: ""
    values:
      layout: default
      image: /assets/social-preview.png
