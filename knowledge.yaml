    path: scripts/check-arch-map.mjs
    intent: "What keeps CLAUDE.md's architecture map complete, and what does it deliberately not check? Asserts every module under src/lib, src/store, server/ and scripts/ is named in §3, scoped per map region so a duplicated basename cannot vouch for its twin. The reverse direction — a name in the map whose file is gone — is explicitly out of scope and stays a review concern."
    format: text
    scope: project
    audience: [agent, developer]
    validated: "2026-08-19"
