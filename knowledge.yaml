relationships:
  - from: claude-instructions
    to: skill-store-persistence
    type: enables
  - from: claude-instructions
    to: skill-export-pipeline
    type: enables
  - from: claude-instructions
    to: skill-security-review
    type: enables
  - from: data-model
    to: skill-export-pipeline
    type: context
  - from: data-model
    to: skill-store-persistence
    type: context
  - from: skill-security-review
    to: skill-export-pipeline
    type: governs
  - from: skill-security-review
    to: ai-import-schema
    type: governs
  - from: desktop-guide
    to: release-policy
    type: enables
  - from: ci-policy
    to: skill-ci-and-release
    type: context
  # The ratchet is a gate's threshold, so the policy that sets it and the skill
  # that explains the gate have to move together.
  - from: coverage-and-bundle-policy
    to: skill-software-testing
    type: governs
  # The map is a claim CLAUDE.md makes about itself; the gate is what keeps the
  # claim true, so the two have to be read together.
  - from: arch-map-policy
    to: claude-instructions
    type: governs
  - from: release-policy
    to: skill-ci-and-release
    type: context
  - from: skill-github-actions-docs
    to: skill-ci-and-release
    type: enables
  # What EXISTS is in feature-map; what does NOT is in open-items. The edge says
  # which way to look: never propose from the feature catalog, never describe
  # current behaviour from the open-items list.
  - from: feature-map
    to: plan-open-items
    type: context
  - from: claude-instructions
    to: plan-open-items
    type: context
  # The in-flight plan supersedes part of one open-items deferral (PWA offline
  # load) and adds the multi-user entry that file never carried.
  - from: plan-multi-user-auth
    to: plan-open-items
    type: context
  # It rewrites both, rather than amending them: accounts add a second class of
  # personal data, and owner-sees-everything has to be stated where a data
  # subject would look for it.
  - from: plan-multi-user-auth
    to: privacy-policy
    type: governs
  - from: plan-multi-user-auth
    to: security-policy
    type: governs
  # The AI exchange schema is a projection of the internal data model.
  - from: data-model
    to: ai-import-schema
    type: context
  # Releasing is where the legal texts become obligations: a desktop build is a
  # redistribution, so the checklist and the build script both depend on them.
  - from: releasing-checklist
    to: third-party-licenses
    type: context
  - from: license
    to: third-party-licenses
    type: context
  # The sync design is what makes per-person erasure possible; the privacy note
  # is that design stated in the terms a data subject would ask about.
  - from: desktop-guide
    to: privacy-policy
    type: context
  - from: security-policy
    to: privacy-policy
    type: context
