# Knowledge Context Protocol manifest — https://github.com/Cantara/knowledge-context-protocol
# Agent-navigable map of this repo's knowledge. Declared, not duplicated: every unit
# points at an existing file. Keep `validated` dates honest — update them when you
# re-verify a unit's accuracy, and when you change a document, update its unit here.
kcp_version: "0.20"
project: resume-studio
version: 1.0.2
updated: "2026-08-20"
language: en
hints:
  recommended_entry_point: claude-instructions

units:
  # ── Instruction layer (eager — Claude Code auto-loads CLAUDE.md) ──────────
  - id: claude-instructions
    path: CLAUDE.md
    intent: "How must an agent work in this codebase? Architecture map (complete by CI gate — see arch-map-policy, and now covering the accounts/authorization/mail server modules and the shell service worker), data model, store patterns, conventions (incl. the v0.3.1 accessibility invariants, the three-surface contrast rule, and the version/build-channel source-of-truth rules), and what not to change. Holds invariants only — the exhaustive feature catalog is in feature-map."
    scope: global
    audience: [agent, developer]
    validated: "2026-08-25"
    update_frequency: weekly
    triggers: [conventions, architecture, data-model, store, persistence, sections, accessibility, routing, export-parity, lookup]
    content_structure:
      primary: prose
      contains: [table, code]
      density: dense
    hints:
      token_estimate: 10600
      load_strategy: eager
      priority: critical

  - id: feature-map
    path: .claude/feature-map.md
    intent: "What features exist and how does each hang together? The exhaustive per-feature design catalog + the recently-shipped changelog, extracted from CLAUDE.md §1 to keep the instruction file lean."
    scope: global
    audience: [agent, developer]
    validated: "2026-08-25"
    update_frequency: weekly
    depends_on: [claude-instructions]
    triggers: [features, changelog, skills-showcase, skill-category, registry, resume-views, import, what-exists]
    not_for: ["coding conventions", "invariants / what not to change", "step-by-step procedures"]
    content_structure:
      primary: prose
      density: dense
    hints:
      token_estimate: 5400
      load_strategy: on_demand
      priority: supplementary

  # ── Project overviews ─────────────────────────────────────────────────────
  - id: readme
    path: README.md
    intent: "What is Resume Studio and how do I install, run, and configure it? Points at deploying-guide for the server build and desktop-guide for the portable one."
    scope: global
    audience: [human, agent]
    validated: "2026-08-20"
    update_frequency: monthly
    triggers: [overview, quickstart, install, configuration, env]
    not_for: ["architecture", "data model", "code conventions"]
    hints:
      token_estimate: 2000
      priority: supplementary

  - id: deploying-guide
    path: DEPLOYING.md
    intent: "How is the server build run on a VPS — what the deployment is (accounts, roles, per-résumé ownership) and is not (no TLS, no self-install, no continuous sync folder), creating the first owner from the one-time bootstrap code, every way back in after a lost password including `npm run recover`, optional email, TLS termination and proxy trust, the three rate limiters, where the database must not live, off-box backups under ownership, a hardened systemd unit, and the full environment reference."
    scope: project
    audience: [human, developer, agent]
    validated: "2026-08-21"
    update_frequency: monthly
    depends_on: [readme, env-reference, security-policy, privacy-policy]
    triggers: [deploy, vps, server-build, self-host, tls, reverse-proxy, systemd, bootstrap-code, accounts, owner, recover, rate-limit, backup, upgrade, trust-proxy]
    not_for: ["the portable desktop build", "code conventions", "how a feature works"]
    content_structure:
      primary: prose
      contains: [table, code]
      density: dense
    hints:
      token_estimate: 6800

  - id: desktop-guide
    path: DESKTOP.md
    intent: "How does the portable desktop build work — building, data dirs, cloud-folder sync (one file per resume, with per-person erasure), manual zip backup/restore, tray, tabbed in-app settings (translation + AI assist + the local .local/.localhost address and port), and auto-update?"
    scope: project
    audience: [human, developer, agent]
    validated: "2026-08-26"
    update_frequency: monthly
    depends_on: [readme]
    triggers: [desktop, launcher, portable, tray, auto-update, sync, backup-folder, local-address, hostname, port]
    hints:
      token_estimate: 3900

