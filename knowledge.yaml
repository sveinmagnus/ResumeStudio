    scope: project
    audience: [human, developer, agent]
    validated: "2026-08-19"
    update_frequency: monthly
    depends_on: [readme]
    triggers: [desktop, launcher, portable, tray, auto-update, sync, backup-folder, local-address, hostname, port]
