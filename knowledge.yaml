    path: eslint.config.js
    intent: "Which code-quality rules does this repo enforce, and — more importantly — which are deliberately OFF and why? Project invariants (lazy exporters, lucide tree-shaking, no process.env in the client, the exportStrings localization boundary), the CLAUDE.md §3 layering as import-x zones, five selected type-aware rules, jsx-a11y, and the vitest/testing-library correctness rules. Read before adding a rule or 'fixing' a disabled one."
